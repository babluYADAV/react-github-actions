
name: "first workflow"

on:
  push:
  pull_request:
    # branches:
    #   - main
    #   - dev
    

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependency
        run: npm ci

      - name: Make React build
        run: npm run build